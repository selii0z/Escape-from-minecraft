name: Tarkov reference audit
on:
  push:
    branches: [feature/tarkov-campaign]
    paths:
      - tools/tarkov_campaign_snapshot.py
      - 'src/main/java/fr/taczoperations/campaign/**'
      - 'src/test/java/fr/taczoperations/campaign/**'
      - .github/workflows/tarkov-reference.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  graph:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Test campaign graph
        run: |
          javac -d build/campaign-tests src/main/java/fr/taczoperations/campaign/CampaignGraph.java src/test/java/fr/taczoperations/campaign/CampaignGraphTest.java
          java -cp build/campaign-tests fr.taczoperations.campaign.CampaignGraphTest
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Fetch and audit reference data
        run: python3 tools/tarkov_campaign_snapshot.py --mode pve
      - name: Upload audit manifest
        uses: actions/upload-artifact@v4
        with:
          name: tarkov-reference-manifest
          path: build/tarkov-reference/manifest.json
          if-no-files-found: error
