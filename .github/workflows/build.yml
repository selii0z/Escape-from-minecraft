name: Build

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile and capture diagnostics
        shell: bash
        run: |
          set -o pipefail
          ./gradlew --no-daemon build --stacktrace --console=plain 2>&1 | tee build-diagnostics.txt
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-diagnostics
          path: build-diagnostics.txt
          if-no-files-found: warn
          retention-days: 7
      - name: Upload compiled mod
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: escape-from-minecraft-dev
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
