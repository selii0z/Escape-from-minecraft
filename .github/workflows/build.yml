name: Build

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  runner-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify runner without project dependencies
        shell: bash
        run: |
          echo "EFM runner is operational"
          uname -s
          printf 'Runner started successfully\n' > runner-diagnostics.txt
      - name: Upload runner proof
        uses: actions/upload-artifact@v4
        with:
          name: runner-diagnostics
          path: runner-diagnostics.txt
          retention-days: 3
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Package complete PvE quest catalogue (campaign branch)
        if: github.ref == 'refs/heads/feature/tarkov-campaign' || github.head_ref == 'feature/tarkov-campaign'
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/tarkov_campaign_snapshot.py --mode pve
          python3 tools/tarkov_campaign_bulk.py
          install -m 644 build/tarkov-review/campaign-install-index.json src/main/resources/data/taczoperations/campaign/campaign-install-index.json
          install -m 644 build/tarkov-review/campaign-unlock-offers.json src/main/resources/data/taczoperations/campaign/campaign-unlock-offers.json
          install -m 644 build/tarkov-review/quests-development.json src/main/resources/data/taczoperations/campaign/quests.json
      - name: Upload bulk install review
        if: github.ref == 'refs/heads/feature/tarkov-campaign' || github.head_ref == 'feature/tarkov-campaign'
        uses: actions/upload-artifact@v4
        with:
          name: campaign-install-review
          path: |
            build/tarkov-review/campaign-install-index.json
            build/tarkov-review/campaign-unlock-offers.json
            build/tarkov-review/bulk-install-candidates.json
            build/tarkov-review/quests-development.json
            build/tarkov-review/stock-activation-report.json
            build/tarkov-review/bulk-summary.json
            build/tarkov-reference/manifest.json
          if-no-files-found: error
      - name: Compile and capture diagnostics
        shell: bash
        run: |
          set -o pipefail
          ./gradlew --no-daemon build --stacktrace --console=plain 2>&1 | tee build-diagnostics.txt
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-diagnostics
          path: build-diagnostics.txt
          if-no-files-found: warn
          retention-days: 7
      - name: Upload compiled mod
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: escape-from-minecraft-dev
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
