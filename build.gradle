plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}

group = 'fr.taczoperations'
version = mod_version
base.archivesName = 'taczoperations'
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version
}

repositories {
    maven {
        url = 'https://maven.theillusivec4.top/'
        content { includeGroup 'top.theillusivec4.curios' }
    }
    maven {
        url = 'https://maven.blamejared.com'
        content { includeGroup 'info.journeymap' }
    }
    maven {
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
}

dependencies {
    compileOnly 'top.theillusivec4.curios:curios-neoforge:9.5.1+1.21.1:api'
    compileOnly 'info.journeymap:journeymap-api-neoforge:2.0.0-1.21.1'
    compileOnly 'maven.modrinth:timeless-and-classics-zero:O2Pfsh6w'
}

processResources {
    inputs.property 'mod_version', project.version
    filesMatching('META-INF/neoforge.mods.toml') {
        expand(mod_version: project.version)
    }
}

// Generate original woven fabric and hardware textures reproducibly at build time.
// Keep the generated PNGs out of the source tree.
def fieldTextures = layout.buildDirectory.dir('generated/fieldTextures')
tasks.register('generateFieldTextures') {
    outputs.dir(fieldTextures)
    doLast {
        def root = fieldTextures.get().asFile
        def palette = [small:0x777f58, patrol:0x997d54, tactical:0x53664c,
            military:0x555e54, expedition:0x776d42, elite:0x344343,
            rig_patrol:0x8a795a, rig_tactical:0x57654c, rig_elite:0x3b4646]
        palette.each { name, rgb ->
            def image = new java.awt.image.BufferedImage(64,64,java.awt.image.BufferedImage.TYPE_INT_ARGB)
            for(int y=0;y<64;y++) for(int x=0;x<64;x++){
                int shade = ((x*17+y*31+x*y*3)%11)-5
                // Alternating threads, broad dyed patches and a stitched perimeter.
                shade += ((x+y)%2==0 ? 3 : -3)
                if(name in ['military','tactical','rig_tactical','expedition']){
                    int patch = ((int)(x/9)+(int)(y/7)*3+(int)((x+y)/13)*5)%7
                    shade += patch<2 ? -15 : patch>4 ? 12 : 0
                }
                if(x<2||y<2||x>61||y>61) shade-=19
                if((x==3||x==60)&&y%5<3) shade+=17
                if((y==3||y==60)&&x%5<3) shade+=17
                if(x==31||x==32) shade-=7
                int r=Math.max(0,Math.min(255,((rgb>>16)&255)+shade))
                int g=Math.max(0,Math.min(255,((rgb>>8)&255)+shade))
                int b=Math.max(0,Math.min(255,(rgb&255)+shade))
                image.setRGB(x,y, (int)(0xff000000L | (r<<16) | (g<<8) | b))
            }
            def file = new File(root,"assets/taczoperations/textures/item/field_"+name+".png")
            file.parentFile.mkdirs()
            javax.imageio.ImageIO.write(image,'png',file)
        }
        [strap:0x34382f, buckle:0x9b9e88, seam:0x252b25].each { name, rgb ->
            def image = new java.awt.image.BufferedImage(64,64,java.awt.image.BufferedImage.TYPE_INT_ARGB)
            for(int y=0;y<64;y++) for(int x=0;x<64;x++){
                int shade = name=='buckle' ? (y<3||x<3 ? 28 : y>60||x>60 ? -28 : ((x*3+y)%7)-3)
                    : ((x%4==0 ? 7 : -2)+(y%3==0 ? 3 : -3))
                int r=Math.max(0,Math.min(255,((rgb>>16)&255)+shade))
                int g=Math.max(0,Math.min(255,((rgb>>8)&255)+shade))
                int b=Math.max(0,Math.min(255,(rgb&255)+shade))
                image.setRGB(x,y,(int)(0xff000000L|(r<<16)|(g<<8)|b))
            }
            def file = new File(root,"assets/taczoperations/textures/item/field_"+name+".png")
            file.parentFile.mkdirs()
            javax.imageio.ImageIO.write(image,'png',file)
        }
    }
}
sourceSets.main.resources.srcDir(fieldTextures)
tasks.named('processResources') { dependsOn tasks.named('generateFieldTextures') }

apply from: 'gradle/raid-art.gradle'

apply from: 'gradle/skill-art.gradle'
apply from: 'gradle/campaign-art.gradle'
apply from: 'gradle/enemy-art.gradle'
apply from: 'gradle/verify-assets.gradle'

// Standalone campaign regression suite, executed by check without JUnit discovery.
tasks.named('test') { failOnNoDiscoveredTests = false }
tasks.register('campaignGraphTest', JavaExec) {
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'fr.taczoperations.campaign.CampaignGraphTest'
}
tasks.named('check') { dependsOn tasks.named('campaignGraphTest') }

apply from: 'gradle/collector-art.gradle'

apply from: 'gradle/tactical-hd.gradle'
