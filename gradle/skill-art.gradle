import java.awt.*
import java.awt.geom.*
import java.awt.image.BufferedImage
import javax.imageio.ImageIO

// Original tactical vector illustrations, baked into PNGs at build time.
def skillArt=layout.buildDirectory.dir('generated/skillArt')
tasks.register('generateSkillArt'){
    inputs.file('gradle/skill-art.gradle')
    outputs.dir(skillArt)
    doLast{
        def ids=['endurance','strength','medicine','search','stealth','survival','weapons','trade']
        def accents=[0xb6b28a,0xc5a475,0xc28678,0x9fbab1,0x8f9c9a,0xb6c18d,0xbaa58c,0xcbb478]
        ids.eachWithIndex { id,index ->
            BufferedImage im=new BufferedImage(512,512,BufferedImage.TYPE_INT_RGB)
            Graphics2D g=im.createGraphics()
            g.setRenderingHint(RenderingHints.KEY_ANTIALIASING,RenderingHints.VALUE_ANTIALIAS_ON)
            g.setRenderingHint(RenderingHints.KEY_RENDERING,RenderingHints.VALUE_RENDER_QUALITY)
            Color ink=new Color(0x101816),shade=new Color(0x34423b),mid=new Color(0x637064),light=new Color(0xb9c1ac),accent=new Color(accents[index] as int)
            def poly={Color c, List pts ->
                def p=new Path2D.Double();p.moveTo(pts[0][0] as double,pts[0][1] as double)
                pts.drop(1).each{ q -> p.lineTo(q[0] as double,q[1] as double) }
                p.closePath();g.setColor(c);g.fill(p)
            }
            def rect={Color c,int x,int y,int w,int h -> g.setColor(c);g.fillRect(x,y,w,h)}
            def round={Color c,int x,int y,int w,int h,int r -> g.setColor(c);g.fillRoundRect(x,y,w,h,r,r)}
            def oval={Color c,int x,int y,int w,int h -> g.setColor(c);g.fillOval(x,y,w,h)}
            def line={Color c,float w,int x,int y,int xx,int yy -> g.setColor(c);g.setStroke(new BasicStroke(w,BasicStroke.CAP_ROUND,BasicStroke.JOIN_ROUND));g.drawLine(x,y,xx,yy)}
            def outline={Color c,float w,int x,int y,int ww,int hh -> g.setColor(c);g.setStroke(new BasicStroke(w));g.drawRoundRect(x,y,ww,hh,13,13)}
            g.setPaint(new GradientPaint(0f,0f,new Color(0x495348),512f,512f,ink));g.fillRect(0,0,512,512)
            g.setColor(new Color(170,190,160,18));g.setStroke(new BasicStroke(1f))
            for(int i=0;i<512;i+=32){g.drawLine(i,0,i,512);g.drawLine(0,i,512,i)}
            oval(new Color(0x26362d),55,45,402,402)
            g.setColor(new Color(180,192,164,40));g.setStroke(new BasicStroke(2f));g.drawOval(55,45,402,402);g.drawOval(72,62,368,368)
            def person={int x,int y,boolean crouch ->
                oval(ink,x-42,y-4,84,84);oval(mid,x-36,y,72,65);poly(shade,[[x-42,y+33],[x+40,y+31],[x+48,y+46],[x-39,y+51]])
                rect(ink,x+8,y+43,34,17)
                poly(mid,[[x-40,y+82],[x+30,y+75],[x+74,y+158],[x+20,y+183],[x-66,y+150]])
                poly(shade,[[x-34,y+83],[x+18,y+80],[x+40,y+147],[x-36,y+158]])
                for(int j=0;j<3;j++)rect(accent,x-28+j*20,y+111,15,27)
                if(crouch){
                    line(ink,48f,x-10,y+167,x+92,y+218);line(mid,35f,x-10,y+167,x+92,y+218)
                    line(ink,46f,x+92,y+218,x+18,y+259);line(shade,33f,x+92,y+218,x+18,y+259)
                    line(ink,45f,x-25,y+164,x-81,y+247);line(mid,32f,x-25,y+164,x-81,y+247)
                    line(ink,28f,x+32,y+105,x+101,y+142);line(light,15f,x+32,y+105,x+101,y+142)
                }else{
                    line(ink,49f,x-22,y+158,x+46,y+226);line(mid,34f,x-22,y+158,x+46,y+226)
                    line(ink,47f,x+46,y+226,x+120,y+283);line(shade,32f,x+46,y+226,x+120,y+283)
                    line(ink,49f,x+10,y+172,x-63,y+238);line(mid,34f,x+10,y+172,x-63,y+238)
                    line(ink,44f,x-63,y+238,x-114,y+190);line(shade,29f,x-63,y+238,x-114,y+190)
                    line(ink,29f,x+30,y+91,x+105,y+114);line(light,16f,x+30,y+91,x+105,y+114)
                    line(ink,28f,x-40,y+92,x-95,y+150);line(mid,15f,x-40,y+92,x-95,y+150)
                }
            }
            switch(id){
                case 'endurance':
                    for(int j=0;j<5;j++)line(new Color(190,185,150,85),5f,40,140+j*42,130+j*7,140+j*42)
                    person(238,84,false)
                    line(accent,8f,86,414,419,414);line(accent,8f,92,436,344,436)
                    break
                case 'strength':
                    poly(ink,[[150,80],[362,80],[407,158],[386,390],[126,390],[105,158]])
                    poly(mid,[[158,95],[350,95],[387,160],[365,371],[147,371],[125,160]])
                    poly(shade,[[179,108],[331,108],[353,186],[335,331],[177,331],[159,186]])
                    outline(accent,5f,179,120,154,202)
                    for(int j=0;j<4;j++){round(ink,145+j*57,268,49,94,9);round(mid,152+j*57,275,35,68,5);rect(accent,155+j*57,283,29,5)}
                    line(light,18f,160,88,205,43);line(light,18f,351,88,306,43)
                    break
                case 'medicine':
                    round(ink,78,138,356,255,38);round(new Color(0x79534e),91,149,330,230,28)
                    round(shade,184,83,144,68,18);round(ink,207,101,98,40,12)
                    outline(accent,5f,108,166,296,193)
                    round(new Color(0x532f2b),156,194,200,133,14)
                    rect(new Color(0xe4d7bf),236,208,40,103);rect(new Color(0xe4d7bf),204,240,104,39)
                    for(int j=0;j<5;j++)rect(ink,114+j*62,345,42,9)
                    break
                case 'search':
                    poly(mid,[[60,220],[260,127],[425,190],[220,280]])
                    poly(shade,[[60,220],[220,280],[220,411],[60,350]])
                    poly(ink,[[220,280],[425,190],[425,321],[220,411]])
                    for(int j=0;j<3;j++)line(mid,7f,235,308+j*30,406,233+j*30)
                    rect(accent,110,284,52,24)
                    oval(ink,208,47,184,184);oval(accent,218,57,164,164);oval(new Color(0x536d69),232,71,136,136)
                    line(ink,35f,347,194,436,300);line(accent,21f,347,194,436,300)
                    line(light,8f,246,113,281,86)
                    break
                case 'stealth':
                    for(int j=0;j<4;j++)poly(ink,[[30+j*132,420],[68+j*132,62],[103+j*132,420]])
                    person(238,108,true)
                    line(accent,7f,64,411,449,411)
                    break
                case 'survival':
                    poly(shade,[[48,360],[149,164],[218,283],[304,105],[468,360]])
                    poly(mid,[[262,180],[304,105],[350,193],[305,173]])
                    for(int j=0;j<3;j++)poly(ink,[[36+j*55,393],[64+j*55,270],[92+j*55,393]])
                    oval(ink,171,172,221,221);oval(accent,182,183,199,199);oval(shade,194,195,175,175)
                    for(int j=0;j<12;j++){double a=j*Math.PI/6;line(light,3f,(int)(281+70*Math.cos(a)),(int)(282+70*Math.sin(a)),(int)(281+82*Math.cos(a)),(int)(282+82*Math.sin(a)))}
                    poly(accent,[[281,211],[314,313],[281,288],[248,313]])
                    poly(light,[[281,353],[248,251],[281,276],[314,251]])
                    oval(ink,274,275,14,14)
                    break
                case 'weapons':
                    oval(shade,87,86,338,338);oval(mid,119,118,274,274);oval(shade,153,152,206,206)
                    oval(accent,202,201,108,108);oval(ink,237,236,38,38)
                    line(light,6f,256,46,256,164);line(light,6f,256,348,256,466)
                    line(light,6f,46,256,164,256);line(light,6f,348,256,466,256)
                    for(int j=0;j<3;j++){oval(ink,345+j*23,385-j*35,22,22);oval(accent,350+j*23,390-j*35,12,12)}
                    break
                case 'trade':
                    round(ink,66,169,380,222,20);round(mid,78,181,356,198,15);rect(shade,78,222,356,142)
                    for(int j=0;j<5;j++)line(mid,5f,90,245+j*26,421,245+j*26)
                    rect(ink,105,202,48,153);rect(ink,360,202,48,153);rect(accent,225,206,62,31)
                    for(int j=0;j<3;j++){round(shade,95+j*37,94-j*10,172,73,6);outline(light,4f,95+j*37,94-j*10,172,73)}
                    for(int j=0;j<4;j++){oval(ink,306+j*13,323-j*11,99,56);oval(accent,310+j*13,316-j*11,91,51);outline(shade,3f,333+j*13,330-j*11,44,22)}
                    break
            }
            // Restrained edge shading and a fine accent strip.
            g.setPaint(new RadialGradientPaint(256f,256f,365f,[0f,0.65f,1f] as float[],[new Color(0,0,0,0),new Color(0,0,0,0),new Color(0,0,0,170)] as Color[]))
            g.fillRect(0,0,512,512);rect(accent,26,476,460,5)
            g.dispose()
            File out=new File(skillArt.get().asFile,'assets/taczoperations/textures/gui/skills/'+id+'.png')
            out.parentFile.mkdirs();ImageIO.write(im,'png',out)
        }
    }
}
sourceSets.main.resources.srcDir(skillArt)
tasks.named('processResources'){ dependsOn tasks.named('generateSkillArt') }
